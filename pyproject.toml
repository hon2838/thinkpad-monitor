[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkpad-monitor"
version = "1.0.0"
description = "Terminal hardware monitoring dashboard for Lenovo ThinkPad & ThinkBook laptops"
readme = "README.md"
authors = [{ name = "Matthew Hon", email = "hon2838@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.8.0"
]
keywords = ["thinkpad", "thinkbook", "hardware-monitor", "telemetry", "curses", "tui", "linux"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities"
]

[project.scripts]
thinkpad-monitor = "thinkpad_monitor:main"

[tool.setuptools]
py-modules = ["thinkpad_monitor"]
