[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkpad-monitor"
version = "2.2.0"
description = "Capability-aware Linux laptop monitor with native desktop and terminal interfaces"
readme = "README.md"
authors = [{ name = "Matthew Hon", email = "hon2838@gmail.com" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.8.0"
]
keywords = ["laptop", "thinkpad", "hardware-monitor", "telemetry", "desktop", "linux"]
classifiers = [
    "Environment :: Console :: Curses",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities"
]

[project.scripts]
thinkpad-monitor = "thinkpad_monitor.cli:main"
thinkpad-monitor-desktop = "thinkpad_monitor.cli:desktop_main"

[project.optional-dependencies]
desktop = [
    # Native-widget probes reproduce reference-count crashes with newer wheels
    # on older Python: ARM64 needs Qt <6.8; x86-64 needs Qt <6.12.
    # Keep current Qt bindings available for Python 3.12 and newer.
    "PySide6>=6.6,<6.8; python_version >= '3.10' and python_version < '3.12' and platform_system == 'Linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')",
    "PySide6>=6.6,<6.12; python_version >= '3.10' and python_version < '3.12' and platform_system == 'Linux' and platform_machine != 'aarch64' and platform_machine != 'arm64'",
    "PySide6>=6.6,<7; python_version >= '3.10' and (python_version >= '3.12' or platform_system != 'Linux')",
]

[tool.setuptools.data-files]
"share/applications" = ["assets/thinkpad-monitor.desktop"]
"share/icons/hicolor/scalable/apps" = ["assets/thinkpad-monitor.svg"]

[tool.setuptools.packages.find]
where = ["src"]
