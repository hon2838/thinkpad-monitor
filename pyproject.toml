[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkpad-monitor"
version = "2.0.0"
description = "Capability-aware Linux laptop monitor with native desktop and terminal interfaces"
readme = "README.md"
authors = [{ name = "Matthew Hon", email = "hon2838@gmail.com" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.8.0"
]
keywords = ["laptop", "thinkpad", "hardware-monitor", "telemetry", "desktop", "linux"]
classifiers = [
    "Environment :: Console :: Curses",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities"
]

[project.scripts]
thinkpad-monitor = "thinkpad_monitor.cli:main"
thinkpad-monitor-desktop = "thinkpad_monitor.cli:desktop_main"

[project.optional-dependencies]
desktop = ["PySide6>=6.6,<7; python_version >= '3.10'"]

[tool.setuptools.data-files]
"share/applications" = ["assets/thinkpad-monitor.desktop"]
"share/icons/hicolor/scalable/apps" = ["assets/thinkpad-monitor.svg"]

[tool.setuptools.packages.find]
where = ["src"]
