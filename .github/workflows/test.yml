name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[desktop]' build
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m thinkpad_monitor --json
      - run: python -m thinkpad_monitor.desktop --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m build
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: desktop-file-validate assets/thinkpad-monitor.desktop
