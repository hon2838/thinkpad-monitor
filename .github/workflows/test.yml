name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 desktop-file-utils
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[desktop]' build
      - name: Test with native-crash diagnostics
        run: |
          set -o pipefail
          python -X faulthandler -m unittest discover -s tests -v 2>&1 | tee test-output.log
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m thinkpad_monitor --json
      - run: python -m thinkpad_monitor.desktop --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m build
      - run: desktop-file-validate assets/thinkpad-monitor.desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-${{ matrix.os }}-${{ matrix.python }}
          path: test-output.log
          if-no-files-found: ignore
