name: Build Linux Desktop Releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 desktop-file-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install '.[desktop]' pyinstaller build
      - name: Test source
        run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build directory bundle
        run: |
          printf 'from thinkpad_monitor.cli import main\nraise SystemExit(main())\n' > /tmp/laptop-monitor-entry.py
          pyinstaller --noconfirm --onedir --name thinkpad-monitor --paths src --hidden-import thinkpad_monitor.desktop /tmp/laptop-monitor-entry.py
          cp assets/thinkpad-monitor.desktop assets/thinkpad-monitor.svg dist/thinkpad-monitor/
      - name: Verify bundled CLI and GUI
        run: |
          dist/thinkpad-monitor/thinkpad-monitor --version
          dist/thinkpad-monitor/thinkpad-monitor --json
          dist/thinkpad-monitor/thinkpad-monitor --smoke-test
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package
        run: |
          tar -C dist -czf thinkpad-monitor-linux-${{ matrix.arch }}.tar.gz thinkpad-monitor
          sha256sum thinkpad-monitor-linux-${{ matrix.arch }}.tar.gz > thinkpad-monitor-linux-${{ matrix.arch }}.tar.gz.sha256
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            thinkpad-monitor-linux-*.tar.gz*
            dist/*.whl
            dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: thinkpad-monitor-linux-*.tar.gz*
          generate_release_notes: true
